name: Build and release

# Every push and pull request is built and tested. Pushing a tag like `v1.0.0`
# additionally builds the disk image and publishes it as a release, which is what
# makes the app downloadable without anyone having to compile it.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and test
    # macOS 15 carries the Xcode 16 toolchain that Swift 6 requires.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        # The suite reads HP's working folder when it is present and skips those
        # cases when it is not, so it runs unchanged on a clean machine.
        run: swift test

  release:
    name: Package and publish
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      # Needed to create the release and upload the disk image to it.
      contents: write
    # Secrets are not available to `if` expressions, so they are read into the
    # environment here and the steps test those variables instead.
    env:
      CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version matches the tag
        # A tag that disagrees with Scripts/version.sh would publish an image whose
        # filename and bundle version do not match the release it is attached to.
        run: |
          source Scripts/version.sh
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$TAG" != "$VERSION" ]]; then
            echo "::error::tag v$TAG does not match VERSION=$VERSION in Scripts/version.sh"
            exit 1
          fi
          echo "version $VERSION matches tag v$TAG"

      - name: Import the signing certificate
        if: env.CERTIFICATE_BASE64 != ''
        run: |
          # A temporary keychain, so the certificate is not left in the default one.
          echo "$CERTIFICATE_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security set-keychain-settings -lut 900 build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain >/dev/null
          security default-keychain -s build.keychain
          rm -f /tmp/cert.p12

      - name: Build the disk image
        env:
          # Becomes CFBundleVersion, which has to increase for every build of the
          # same marketing version.
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [[ -z "$CERTIFICATE_BASE64" ]]; then
            echo "No signing certificate configured; the app will be signed ad-hoc"
            echo "and macOS will quarantine a downloaded copy."
          fi
          ./Scripts/make-dmg.sh build

      - name: Notarize the disk image
        # Only runs when the notarization credentials are configured. Without them
        # the image is still published, signed but not notarized, and the release
        # notes tell the reader what macOS will do about that.
        if: env.NOTARY_APPLE_ID != '' && env.NOTARY_PASSWORD != ''
        run: |
          source Scripts/version.sh
          DMG="build/PrimeConnectionKit-$VERSION.dmg"

          # Credentials are passed as flags rather than stored in a keychain
          # profile, since the runner is discarded after the job.
          xcrun notarytool submit "$DMG" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --wait

          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

          # The assessment should now pass. It does not for an unstapled image, so
          # this is the check that the ticket actually took.
          spctl -a -t open --context context:primary-signature -v "$DMG"

          # Stapling modifies the file, so the checksum computed when it was built
          # no longer matches what will be uploaded. It is regenerated here.
          ( cd build && shasum -a 256 "$(basename "$DMG")" > "$(basename "$DMG").sha256" )
          echo "checksum regenerated after notarization"

      - name: Upload the disk image as a workflow artifact
        # Available even when the release step is skipped, or when it needs re-running.
        uses: actions/upload-artifact@v4
        with:
          name: PrimeConnectionKit-dmg
          path: |
            build/*.dmg
            build/*.sha256

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source Scripts/version.sh
          DMG="build/PrimeConnectionKit-$VERSION.dmg"

          # The notes live in the repository so they can be reviewed in a pull
          # request, with the version substituted in.
          sed "s/@@VERSION@@/$VERSION/g" .github/release-notes.md > /tmp/notes.md
          grep -q "@@" /tmp/notes.md && { echo "::error::unsubstituted placeholder in the release notes"; exit 1; }

          # The Gatekeeper note depends on whether this build was actually
          # notarized. Both variants are tracked files so they can be reviewed in a
          # pull request, rather than being written inline where nobody reads them.
          if [[ -n "$NOTARY_APPLE_ID" && -n "$NOTARY_PASSWORD" ]]; then
            GATEKEEPER_SECTION=.github/gatekeeper-notarized.md
          else
            GATEKEEPER_SECTION=.github/gatekeeper-unnotarized.md
          fi

          # The section is spliced in with awk rather than sed, because it contains
          # characters that are special to a sed replacement.
          awk -v section="$GATEKEEPER_SECTION" '
            /@@GATEKEEPER_SECTION@@/ { while ((getline line < section) > 0) print line; next }
            { print }
          ' /tmp/notes.md > /tmp/notes-final.md
          mv /tmp/notes-final.md /tmp/notes.md

          grep -q "@@" /tmp/notes.md && { echo "::error::the Gatekeeper section was not substituted"; exit 1; }
          echo "release notes assembled from $GATEKEEPER_SECTION"

          gh release create "$GITHUB_REF_NAME" \
            --title "Prime Connection Kit $VERSION" \
            --notes-file /tmp/notes.md \
            "$DMG" "$DMG.sha256"
